      - {name: region, type: string, description: "Region name, 2015 regional division"}
      - {name: unit_2004, type: string, description: "Comparable unit over the whole period: the province plus the provinces carved out of it after 2004 ('+' joined codes); MA-CAS for all Casablanca prefectures"}
      - {name: ref_date, type: string, description: "Reference date of the count as printed in the table title (year, or year-month)"}
      - {name: year, type: integer, description: "Data year of the report edition the value comes from"}
      - {name: indicator, type: string, description: "primary_care_facilities (ESSP network) or support_facilities"}
      - {name: setting, type: string, description: "urban, rural or total"}
      - {name: category, type: string, description: "Facility type (for example urban health centre level 1, CSU-1), or 'all' for the total of the setting"}
