overview: |
  Morocco's Ministry of Health has published a yearly statistical report,
  *Santé en Chiffres*, since the early 2000s. Its province tables are the
  only public source on where health facilities and hospital beds are and
  how they are used, but they are scattered over 22 PDF files whose layout,
  table numbers and place-name spellings change from one edition to the
  next. Morocco also created new provinces in 2009 and redrew its regions
  in 2015.

  This dataset puts two decades of those tables into three clean long
  tables with one code system. Each row names its province, its current
  region, a comparable unit that stays stable over the whole period, the
  value, the report page it comes from, and a note when anything was done
  to it.

  Use `unit_2004` to build series that span the 2009 province splits: it
  groups a province with the provinces later carved out of it, so sums by
  `unit_2004` are comparable from 2003 to 2024.

good_for:
  - "Trends in primary care supply and hospital capacity by province over 20 years"
  - "Inequality in health facility and bed density between provinces"
  - "Covariates for ecological studies of health outcomes"
  - "Evaluating health system reforms (2009 provinces, 2015 regions, university hospitals opened since 2014)"
not_good_for:
  - "Private sector facilities and clinics (not covered by these tables)"
  - "Hospital-level analysis (values are province totals)"
  - "Year-by-year facility counts before 2019 (facilities are reported every two years between 2007 and 2017)"

files:
