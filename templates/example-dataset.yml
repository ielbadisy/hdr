    title: "Public hospital beds and activity"
    description: "One row per year, province and indicator"
    variables:
      - {name: code, type: string, description: "Province or prefecture code (ISO 3166-2:MA)"}
      - {name: province, type: string, description: "Province or prefecture name"}
      - {name: region_code, type: string, description: "Region code, 2015 regional division"}
      - {name: region, type: string, description: "Region name, 2015 regional division"}
      - {name: unit_2004, type: string, description: "Comparable unit over the whole period (see facilities.csv)"}
      - {name: year, type: integer, description: "Year of activity"}
      - {name: indicator, type: string, description: "beds (functional beds), patient_days, admissions, occupancy_rate (%), average_length_of_stay (days)"}
      - {name: value, type: number, description: "Value of the indicator; occupancy rate and length of stay are recomputed from the counts"}
      - {name: source, type: string, description: "Report edition and page(s)"}
      - {name: note, type: string, description: "How the value was chosen when the report disagrees with itself, flags, and formulas for computed indicators"}
  - name: provinces.csv
    title: "Provinces and comparable units"
    description: "One row per province or prefecture code used in the data files"
    variables:
      - {name: code, type: string, description: "Province or prefecture code"}
      - {name: name, type: string, description: "Name"}
      - {name: type, type: string, description: "province, prefecture or prefecture-arrondissements"}
      - {name: region_code, type: string, description: "Region code, 2015 regional division"}
      - {name: region, type: string, description: "Region name, 2015 regional division"}
      - {name: unit_2004, type: string, description: "Comparable unit over the whole period"}
      - {name: unit_2004_members, type: string, description: "All codes grouped in the comparable unit (';' separated)"}

known_issues:
  - "**Facility counts are not yearly before 2019.** Editions between 2007 and 2017 repeat the table of the previous edition every other year; each count is kept once, under its own reference date (15 dates from 2003 to 2024)."
  - "**Provinces created in 2009 appear from 2009 or 2011.** Before that, their facilities and beds are counted in the parent province. Use `unit_2004` for series over the whole period."
  - "**Provinces without a hospital have no hospital rows** (for example Médiouna and Al Haouz in 2003-2004). Absence means none listed, not missing data: province sums equal the national totals in every year."
  - "**Hospital values in 2013-2024 come from hospital lists.** When the list and the printed province total disagree, the value that makes the printed region total add up is kept, and the note says so (9 province-years)."
  - "**A few printed values look implausible but are consistent with the report's totals**, for example Taroudant 2015 (679 beds, against about 300 in 2014 and 2016). They are kept as printed and flagged as 'isolated spike' in the note (19 province-years)."
  - "**Patient days or admissions printed as 0 for a hospital with open beds** are set to missing (4 values)."
  - "**University hospitals (CHU)** are included in the hospital figures of their host prefecture (for example Casablanca-Anfa, Rabat, Fès, Marrakech, Oujda, Tanger), which explains jumps when a CHU opens (Oujda 2015, Tanger 2023)."

